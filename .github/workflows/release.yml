name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Must match ci.yml's pin.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "STAGING=vzy-${VERSION}-darwin-arm64" >> "$GITHUB_OUTPUT"

      - name: Build and sign release binary
        run: ./build.sh release

      # `vzy run` compiles user scripts against the VZYKit sources beside
      # the binary's real file, so the tarball carries the library targets
      # plus the run-only manifest (VZYKit + VZYKitObjC, no argument-parser
      # dependency and no test target) alongside the signed binary.
      - name: Stage versioned artifact
        env:
          STAGING: ${{ steps.version.outputs.STAGING }}
        run: |
          mkdir -p "$STAGING/Sources"
          cp "$(swift build -c release --show-bin-path)/vzy" "$STAGING/"
          cp scripts/Package.run.swift "$STAGING/Package.swift"
          cp -R Sources/VZYKit Sources/VZYKitObjC "$STAGING/Sources/"
          cp -R Resources examples "$STAGING/"
          tar -czf "${STAGING}.tar.gz" "$STAGING"
          shasum -a 256 "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          STAGING: ${{ steps.version.outputs.STAGING }}
        run: |
          gh release create "v${VERSION}" \
            "${STAGING}.tar.gz" \
            "${STAGING}.tar.gz.sha256" \
            --title "v${VERSION}" \
            --generate-notes

      - name: Update Homebrew tap
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          STAGING: ${{ steps.version.outputs.STAGING }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set, skipping Homebrew tap update"
            exit 0
          fi

          SHA256="$(awk '{print $1}' "${STAGING}.tar.gz.sha256")"
          URL="https://github.com/obj-p/vzy/releases/download/v${VERSION}/${STAGING}.tar.gz"

          bash scripts/generate-formula.sh "$VERSION" "$URL" "$SHA256" > vzy.rb

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/obj-p/homebrew-tap.git" tap-repo
          mkdir -p tap-repo/Formula
          cp vzy.rb tap-repo/Formula/vzy.rb
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/vzy.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "vzy ${VERSION}"
          git push origin main
